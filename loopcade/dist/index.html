<!doctype html>
<html lang="nl-BE">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0c0c18">
  <meta name="description" content="Plan een loop- of wandelrondje over de straten van Gent. Kies je afstand en kom terug bij je startpunt.">
  <title>Loopcade · Routeplanner</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preload" href="pixel.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top"><div class="shell top-inner">
    <a class="brand" href="#planner" aria-label="Loopcade startpagina"><img src="logo.svg" width="39" height="39" alt=""><span>LOOP<span>CADE</span></span></a>
    <nav aria-label="Hoofdnavigatie">
      <a href="#planner" data-page="planner" class="current"><i data-icon="route"></i>Routeplanner</a>
      <a href="#activities" data-page="activities"><i data-icon="activity"></i>Activiteiten</a>
      <a href="#friends" data-page="friends"><i data-icon="users"></i>Vrienden</a>
    </nav>
    <button class="point-badge" id="score-link" title="Bekijk je punten en records"><i data-icon="coin"></i><span id="total">0</span> <span>PTS</span></button>
    <div class="account-control"><span id="account-status" role="status">Account laden…</span><button class="button ghost" id="account-button" type="button">Account</button></div>
  </div></header>
  <main class="shell">
    <section class="banner" aria-labelledby="page-title">
      <canvas id="skyline" aria-hidden="true"></canvas>
      <div class="banner-text"><div class="speed-lines" aria-hidden="true"><b></b><b></b><b></b></div>
        <h1 id="page-title">Routeplanner</h1>
        <p id="page-intro">Jouw afstand, een nieuw rondje. Terug waar je begon.</p>
      </div>
    </section>
    <section id="planner" class="workspace">
      <form class="panel setup" id="config">
        <h2 class="panel-heading"><i data-icon="sliders"></i>Route instellen</h2>
        <div class="form-body">
          <fieldset><legend>Activiteit</legend><div class="mode-switch">
            <label><input type="radio" name="mode" value="run" checked><span><i data-icon="run"></i>Lopen</span></label>
            <label><input type="radio" name="mode" value="walk"><span><i data-icon="walk"></i>Wandelen</span></label>
          </div></fieldset>
          <div><label class="field-label" for="start-place">Startpunt</label>
            <button type="button" class="field-button" id="start-place"><i data-icon="pin"></i><span id="place-label">Korenmarkt, Gent</span><i data-icon="chevron"></i></button>
          </div>
          <div class="distance-field"><label class="field-label" for="distance">Gewenste afstand</label>
            <div class="distance-number"><span id="distance-label">5,0</span> <small>km</small></div>
            <input id="distance" type="range" min="1" max="12" step="0.5" value="5" aria-valuetext="5 kilometer">
            <div class="range-ends"><span>1 km</span><span>12 km</span></div>
          </div>
          <button type="submit" class="button pink wide" id="generate" disabled><i data-icon="shuffle"></i>Genereer rondje</button>
          <p class="form-feedback" id="form-feedback" role="status"></p>
        </div>
      </form>
      <article class="panel preview" id="preview">
        <div class="panel-heading"><h2><i data-icon="route"></i>Jouw rondje</h2><span class="live-badge" id="route-status"><b></b>Kaart laden</span></div>
        <div class="map-frame" id="map-frame">
          <canvas id="map" tabindex="0" aria-label="Routekaart van Gent. Gebruik de pijltjestoetsen om te verschuiven en plus of min om in te zoomen."></canvas>
          <div class="map-location"><i data-icon="pin"></i> GENT, BE</div>
          <div class="map-tools"><button type="button" id="zoom-in" aria-label="Inzoomen">+</button><button type="button" id="zoom-out" aria-label="Uitzoomen">−</button><button type="button" id="map-fit" aria-label="Volledige route tonen"><i data-icon="frame"></i></button></div>
          <div class="map-scale" id="scale"></div>
          <a class="attribution" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">© OpenStreetMap</a>
        </div>
        <div id="options" class="alternatives" hidden></div>
        <div class="route-stats" aria-live="polite">
          <div><span><i data-icon="route"></i>Afstand</span><strong id="stat-distance">—</strong></div>
          <div><span><i data-icon="clock"></i>Geschatte tijd</span><strong id="stat-time">—</strong></div>
          <div><span><i data-icon="mountain"></i>Stijging</span><strong id="stat-height">—</strong></div>
          <div><span><i data-icon="coin"></i>Beloning</span><strong id="stat-points">—</strong></div>
        </div>
        <div class="route-bottom"><span class="difficulty"><i data-icon="signal"></i><span id="difficulty">Moeilijkheid laden</span></span>
          <button class="button aqua" id="start-run" disabled><i data-icon="play"></i>Start rondje</button>
        </div>
      </article>
    </section>
    <section id="activities" hidden></section>
    <section id="friends" hidden></section>
    <footer><span class="foot-brand"><b></b><b></b><b></b> LOOPCADE</span><button class="text-link" id="credits">Kaart & gegevens</button></footer>
  </main>
  <dialog id="dialog"><div class="dialog-top"><h2 id="dialog-title"></h2><button class="icon-btn" id="dialog-close" aria-label="Sluiten">×</button></div><div id="dialog-body"></div></dialog>
  <div id="toast" role="status"></div>
  <script src="skyline.js"></script><script type="module" src="app.mjs"></script>
</body>
</html>
